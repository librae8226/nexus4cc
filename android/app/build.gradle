apply plugin: 'com.android.application'

// ── 版本号派生自 package.json ────────────────────────────────────────────
// 项目的版本事实源是 git tag，package.json 必须跟着走（见 CLAUDE.md）。
// Android 不再做第四处手工维护，而是派生消费：现有的发布流程
// （改两个 package.json → commit → tag）自动产出版本正确的 APK。
//   4.8.6 -> versionName "4.8.6", versionCode 40806（主*10000+次*100+修订）
// tokenize('.-') 而非 '.'：容忍 4.9.0-rc1 这类预发布后缀，否则 `as int` 会抛错。
def pkgVersion = new groovy.json.JsonSlurper().parseText(file('../../package.json').text).version
def versionParts = pkgVersion.tokenize('.-').take(3)
if (versionParts.size() < 3 || versionParts.any { !(it ==~ /\d+/) }) {
    throw new GradleException("package.json 的 version 不是 MAJOR.MINOR.PATCH 形式（读到 '${pkgVersion}'），无法派生 versionCode")
}
def (verMajor, verMinor, verPatch) = versionParts.collect { it as int }

// ── release 签名 ────────────────────────────────────────────────────────
// keystore.properties 不进版本库（已 gitignore），文件不在时就跳过 —— 这样
// 新克隆的仓库/CI 仍能构建 debug 包，不需要把签名密钥塞进 CI secrets。
def keystorePropsFile = rootProject.file('keystore.properties')
def hasReleaseSigning = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasReleaseSigning) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    namespace = "com.librae.nexus"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.librae.nexus"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode verMajor * 10000 + verMinor * 100 + verPatch
        versionName pkgVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // ── 两个风味包：经典 Nexus / 对讲机（F-24）────────────────────────────
    // 对讲机是个实验，不想动现有那个包 —— 但也不想维护第二份 Android 工程
    // （gradle 壳子、图标、签名、Capacitor 配置全都要跟着同步，迟早不一致）。
    // 所以用 product flavor：同一份代码、同一份 web 产物，只差 applicationId、
    // 名字、图标底色，和一个 assets/public/ui-mode.json（前端启动时读它决定
    // 默认进哪个界面，见 frontend/src/walkie/mode.ts）。
    //
    // 两个包 applicationId 不同 ⇒ 可以同时装在手机上，数据互不干扰
    // （localStorage 是按包隔离的），FileProvider authority 也跟着 applicationId
    // 派生，不会撞。
    //
    // 构建：
    //   android/build-apk.sh assembleWalkieRelease   # 只出对讲机包
    //   android/build-apk.sh assembleClassicRelease  # 只出经典包
    //   android/build-apk.sh assembleRelease         # 两个都出
    flavorDimensions "ui"
    productFlavors {
        classic {
            dimension "ui"
            applicationId "com.librae.nexus"
        }
        walkie {
            dimension "ui"
            applicationId "com.librae.nexus.walkie"
        }
    }

    buildTypes {
        release {
            // 没签名配置时不静默产出未签名包 —— 那种包装上会失败，且报错离原因很远。
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                throw new GradleException("缺少 android/keystore.properties，无法签名 release 包。见 docs/ANDROID-APP.md §6.9")
            }
            // 不开 R8：包体的大头是 frontend/dist（Vite 已经压过），Java 侧只剩
            // Capacitor 桥和几行 MainActivity，混淆省不下什么，却可能把运行时反射
            // 用到的东西裁掉 —— 换来的是难以定位的崩溃，不值。
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
